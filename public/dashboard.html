<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workflow dashboard</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Operations</p>
        <h1>Workflow dashboard</h1>
        <p class="muted" id="status">Loading...</p>
      </div>
      <button class="button secondary" id="logout">Log out</button>
    </header>

    <section class="controls" aria-label="Dashboard filters">
      <label>Date <input type="date" id="date"></label>
      <label>Timezone
        <select id="timezone">
          <option value="browser">Browser local</option>
          <option value="UTC">UTC</option>
          <option value="Pacific">Pacific</option>
          <option value="Mountain">Mountain</option>
          <option value="Central">Central</option>
          <option value="Eastern">Eastern</option>
        </select>
      </label>
      <div class="summary" id="summary"></div>
    </section>

    <section id="login" class="login-panel" hidden>
      <h2>Operator sign in</h2>
      
      <!-- Step 1: Request OTP -->
      <form id="request-otp-form">
        <label>Email <input type="email" id="email" required autocomplete="username" placeholder="operator@example.com"></label>
        <button class="button" type="submit" id="send-otp-btn">Send OTP</button>
        <p class="error" id="email-error"></p>
      </form>

      <!-- Step 2: Verify OTP -->
      <form id="verify-otp-form" hidden>
        <p class="info-message" id="otp-sent-info">OTP sent to your email.</p>
        <label>Enter 6-Digit OTP <input type="text" id="otp" required autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456"></label>
        <div class="button-group">
          <button class="button" type="submit" id="verify-otp-btn">Verify & Sign in</button>
          <button class="button secondary" type="button" id="resend-otp-btn">Resend OTP</button>
        </div>
        <button class="link-button" type="button" id="change-email-btn">← Use a different email</button>
        <p class="error" id="otp-error"></p>
      </form>
    </section>

    <section id="users" class="users" hidden></section>
  </main>
  <script src="/dashboard.js"></script>
</body>
</html>
